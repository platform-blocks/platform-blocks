name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/platform-blocks.com/package-lock.json

      - name: Install dependencies (docs)
        run: npm ci
        working-directory: apps/platform-blocks.com

      - name: Build Expo web bundle
        run: npm run build-web
        working-directory: apps/platform-blocks.com
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_WEB_APP_ROOT: "/"

      # No SPA-fallback step here on purpose. `build-web` already writes
      # dist/404.html from dist/index.html (scripts/inject-seo-tags.ts) and then
      # marks it noindex. Copying index.html over it again after the build undoes
      # that, republishing the fallback as an indexable page whose canonical
      # points at the homepage.

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: apps/platform-blocks.com/dist
          force_orphan: true
          cname: platform-blocks.com
