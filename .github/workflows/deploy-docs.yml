name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: plocks

      - name: Checkout example apps
        uses: actions/checkout@v4
        with:
          repository: platform-blocks/examples
          path: examples

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            plocks/package-lock.json
            examples/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: plocks

      - name: Build plocks UI
        run: npm run ui:build
        working-directory: plocks

      - name: Install example app dependencies
        run: npm ci
        working-directory: examples

      - name: Build docs and live demos
        run: npm run build-web-with-demos
        working-directory: plocks/apps/docs
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_WEB_APP_ROOT: "/"

      # No SPA-fallback step here on purpose. `build-web` already writes
      # dist/404.html from dist/index.html (scripts/inject-seo-tags.ts) and then
      # marks it noindex. Copying index.html over it again after the build undoes
      # that, republishing the fallback as an indexable page whose canonical
      # points at the homepage.

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: plocks/apps/docs/dist
          force_orphan: true
          cname: plocks.dev
